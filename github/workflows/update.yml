name: Advance Daily Update - Same Look

on:
  schedule:
    - cron: '30 1 * * *'  # 7 AM IST daily
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Dependencies
        run: pip install requests beautifulsoup4
      
      - name: Run Advance Scraper (Same Look - Jobs & Design Same)
        run: python advance-scraper.py
      
      - name: Check Changes
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --stat
          fi
      
      - name: Push to GitHub -> Triggers Cloudflare Auto Deploy
        if: steps.check.outputs.changed == 'true'
        run: |
          git config --local user.email "bot@northbharatjobs.pages.dev"
          git config --local user.name "North Bharat Bot"
          git add index.html about.html privacy.html contact.html terms.html cookies.html disclaimer.html sitemap.xml
          git commit -m "Advance Update: $(date +'%d %b %Y') - Same Look, Fresh Date - Cloudflare Deploy"
          git push
          echo "✅ Pushed - Cloudflare will Auto Deploy in 60s"
